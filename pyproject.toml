[project]
name = "epubtranslator"
version = "0.1.0"
description = "Self-hosted pipeline: EPUB translation and learning materials generation"
requires-python = ">=3.11,<3.14"
dependencies = [
    "epub-translator>=0.1.10",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "jsonschema>=4.26.0",
    "langdetect>=1.0.9",
    "lxml>=6.1.3",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "spacy>=3.8.16",
    "tiktoken>=0.14.0",
    "uvicorn>=0.52.4",
    "wordfreq>=3.1.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PTH", "PL", "RUF",
]
ignore = [
    "PLR0913",  # много аргументов у служебных фабрик
    "PLR2004",  # магические числа в порогах сравнений в тестах
    "RUF001",  # кириллица в строках/комментариях — намеренна (код русскоязычный)
    "RUF002",
    "RUF003",
]

[tool.ruff.lint.per-file-ignores]
# XHTML-строки фикстур — данные, не код
"tests/fixtures/epub/build.py" = ["E501"]
# Стансы: F401 — re-export публичных имён пакета в __init__
"stubs/**/*.pyi" = ["F401", "I001"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_unreachable = true
pretty = true
mypy_path = "stubs"

[[tool.mypy.overrides]]
# epub-translator 0.1.10 не публикует py.typed — импорты не типизированы
module = ["epub_translator", "epub_translator.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
log_cli = false

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.7",
    "types-jsonschema>=4.26.0.20260518",
    "types-pyyaml>=6.0.12.20260906",
]
