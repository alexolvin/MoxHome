# L2-7: golden-набор словоизменения (склоняемые имена собственные), 30 случаев
# = 5 имён × 6 падежей единственного числа. Данные, не код (Rule 1).
#
# Назначение: проверка согласованности (app/glossary/consistency.py) НЕ должна
# давать ложных расхождений на падежных формах ОДНОГО И ТОГО ЖЕ имени
# (L2-7: 0). Без парадигмы (только каноническая форма) те же 30 случаев дают
# ложные расхождения — тест T-L2-7 показывает оба режима.
#
# Структура записи: source_term — исходный (en) термин; forms — полные 12 форм
# парадигмы ru (порядок имён форм — pack.yaml: noun/proper_noun); sentences —
# по одному предложению-переводу на падеж единственного числа (вхождение
# термина в исходном сегменте гарантируется тестом). Совпадающие пары форм
# (им. = вин. у неодушевлённых) — норма: в парадигме они объясняются (L2.4).
