# Golden-набор S2 (de): 30 предложений с разорванной отделяемой приставкой
# (DE-TRENNBAR). Ожидаемая unit_lemma = приставка + лемма глагола (механизм
# L1 lexical_units). Словарный состав контролируется: между глаголом и
# приставкой — только наречия (именные constituents механизм L1 запрещает),
# поэтому NomVerb-биграммы (NOUN+VERB) в предложениях не повторяются.
