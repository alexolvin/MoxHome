# Языковой пакет (L0.1) — язык это данные, а не код (Rule 1).
# Реестр обнаруживается по каталогу config/languages/<code>/ (списка языков
# в коде Python нет). Резолвер (L0.2) вычисляет статус пары по фактическим
# ресурсам — pack.yaml описывает, ЧТО должно быть, а не то, что есть.
code: en
name: English
aliases: [eng]
spacy_model: en_core_web_sm  # NLP-пайплайн (L1); версия зафиксирована в docs/HANDOFF.md
frequency_source: wordfreq  # источник частотности (L1: Zipf-шкала, bands в пакете)
cefr_source: derived  # L0: объявлено; L1 — проверка фактического CEFR-лексикона и
  # его лицензии (docs/LIMITATIONS.md); неясная лицензия → derived (тихая подмена
  # источника запрещена, Rule 2)
fixture: tests/fixtures/epub/complex.epub  # фикстура исходного языка (относительно корня проекта)
# golden.yaml — golden-набор языка (L0: семя эталонных предложений;
# L1/T-L1-10: расширение до 20 предложений с размеченными явлениями).
