# Таксономия правок постредактуры (MTPE §4.4) — данные, не код (Rule 1).
# `id` — стабильный идентификатор: модель возвращает ТОЛЬКО `id` из этого списка;
# `id` вне таксономии — отказ жёсткой проверки H1 (ответ идёт на следующую ступень
# лестницы §4.6). `description` — данные (человекочитаемое описание правки).
# Новый идентификатор — только добавлением строки сюда; в коде таксономии нет (M4-10).
