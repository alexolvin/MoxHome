    description: "добавление в черновике"
  - id: ACC-RETRANSLATE
    description: "черновик непригоден, сегмент переведён заново (только при draft_bad)"
  - id: TERM-GLOSSARY
    description: "термин приведён к глоссарию"
  - id: GRAM-AGREEMENT
    description: "род, число, падеж, вид, управление"
