# EpubTranslator — пример YAML-конфигурации.
# E4.1: адреса и модели LLM задаются ТОЛЬКО здесь (в профилях) — это единственный
# источник; в .env — только секреты (API-ключи) и адрес бинда (см. .env.example).
#
# Установка: cp config/config.example.yaml config/config.yaml

server:
  port: 8321
  heartbeat_seconds: 15.0
  lease_seconds: 30.0  # E3-1: ≤ 2× heartbeat_seconds

storage:
  # Корень всех данных проекта (input/, working/, output/, jobs/, cache/, ...).
  root: /mdisk/EpubTranslator
  busy_timeout_ms: 5000
  # dirs:  # имена каталогов внутри storage.root (можно переопределить)
  #   input: input
  #   working: working
  #   output: output
  #   jobs: jobs
  #   cache: cache
  #   logs: logs
  #   backups: backups
  #   books: books
  #   data: data

llm:
  # E4.1: base_url и model — единственный источник настроек LLM (любые
  # OpenAI-совместимые эндпоинты: vLLM, Ollama, ...; привязка к серверу запрещена).
  # API-ключи — в .env (LLM_API_KEY; опционально LLM_ANALYSIS_API_KEY).
  # Опционально: цены за 1M токенов (input_price_per_mtok / output_price_per_mtok);
  # без них стоимость показывается как `Cost: unknown` (E4-6).
  profiles:
    translation:
      base_url: http://localhost:8000/v1
      model: example-model
      token_encoding: cl100k_base
      temperature: 0.2
      timeout_seconds: 300
      retry_times: 3
      max_retries: 5
      concurrency: 1
      max_group_tokens: 2600
    fill:
      base_url: http://localhost:8000/v1
      model: example-model
      token_encoding: cl100k_base
      temperature: 0.2
      timeout_seconds: 300
      retry_times: 3
      max_retries: 5
      concurrency: 1
      max_group_tokens: 2600
    analysis:
      base_url: http://localhost:8000/v1
      model: example-model
      token_encoding: cl100k_base
      temperature: 0.1
      timeout_seconds: 120
      retry_times: 3
      max_retries: 3
      concurrency: 1

limits:
  vocabulary_max_cards_per_1000_words: 15
  grammar_max_notes_per_chapter: 10
  glossary_max_user_prompt_chars: 8000

alignment:
  min_coverage: 0.995
  # E6.3: критерий белого списка «идентичен оригиналу» (регулярный шаблон по
  # нормализованному тексту): перевод, совпадающий с оригиналом, нарушением
  # НЕ является, если текст целиком соответствует шаблону (числа, имена
  # собственные без склонения и т.п.).
  identical_whitelist_pattern: "^[\\d\\s.,;:()\\-–—/%$€]+$"

segmentation:
  block_tags: [p, li, blockquote, h1, h2, h3, h4, h5, h6, dd, dt, td]

language_detection:
  sample_segments: 200
  min_confidence: 0.6

epubcheck:
  # Путь к EPUBCheck-jar (E5). Распределение W3C 5.x: каталог <каталог-jar>/lib
  # рядом с jar — класспасс собирается автоматически. Отсутствие jar/Java →
  # задание не станет COMPLETED: COMPLETED_WITH_WARNINGS (VALIDATION_UNAVAILABLE, Rule 6).
  jar_path: data/tools/epubcheck.jar
  timeout_seconds: 300

translation:
  # Режим перевода задания (E5.2): translation → REPLACE (движок),
  # bilingual → значение ниже. APPEND_BLOCK по умолчанию; APPEND_TEXT доступен
  # настройкой, но не используется по умолчанию (ухудшает выравнивание).
  submit_mode_bilingual: APPEND_BLOCK
