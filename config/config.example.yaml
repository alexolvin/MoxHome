# MoxHome — пример YAML-конфигурации.
# E4.1: адреса и модели LLM задаются ТОЛЬКО здесь (в профилях) — это единственный
# источник; в .env — только секреты (API-ключи) и адрес бинда (см. .env.example).
#
# Установка: cp config/config.example.yaml config/config.yaml

server:
  port: 8321
  heartbeat_seconds: 15.0
  lease_seconds: 30.0  # E3-1: ≤ 2× heartbeat_seconds

storage:
  # Корень всех данных проекта (input/, working/, output/, jobs/, cache/, ...).
  # Относительный путь разрешается от каталога запуска (по умолчанию — корень репозитория).
  root: .
  busy_timeout_ms: 5000
  # dirs:  # имена каталогов внутри storage.root (можно переопределить)
  #   input: input
  #   working: working
  #   output: output
  #   jobs: jobs
  #   cache: cache
  #   logs: logs
  #   backups: backups
  #   books: books
  #   data: data

llm:
  # E4.1: base_url и model — единственный источник настроек LLM (любые
  # OpenAI-совместимые эндпоинты: vLLM, Ollama, ...; привязка к серверу запрещена).
  # API-ключи — в .env (LLM_API_KEY; опционально LLM_ANALYSIS_API_KEY).
  # Опционально: цены за 1M токенов (input_price_per_mtok / output_price_per_mtok);
  # без них стоимость показывается как `Cost: unknown` (E4-6).
  # extra_body: дополнительные поля тела запроса chat/completions — расширенные
  # параметры владения OpenAI-совместимого эндпоинта (vLLM, Ollama, ...).
  # Пример для thinking-моделей Qwen3 на vLLM (без него reasoning-поток
  # попадает в контент ответа): extra_body: {chat_template_kwargs: {enable_thinking: false}}.
  # D62: корень промптов — по умолчанию <storage.root>/prompts; относительный путь
  # разрешается от storage.root, абсолютный — как есть. Явно заданный
  # несуществующий каталог — отказ старта (ConfigurationError).
  prompts_root: prompts
  # Таймаут кнопки «Проверить» на экране «LLM и модели», с (MTPE TZ §5.1).
  probe_timeout_s: 300
  profiles:
    translation:
      base_url: http://localhost:8000/v1
      model: example-model
      token_encoding: cl100k_base
      temperature: 0.2
      timeout_seconds: 300
      retry_times: 3
      max_retries: 5
      concurrency: 1
      max_group_tokens: 2600
      warmup_timeout_s: 900
      extra_body: {}
    fill:
      base_url: http://localhost:8000/v1
      model: example-model
      token_encoding: cl100k_base
      temperature: 0.2
      timeout_seconds: 300
      retry_times: 3
      max_retries: 5
      concurrency: 1
      max_group_tokens: 2600
      warmup_timeout_s: 900
      extra_body: {}
    analysis:
      base_url: http://localhost:8000/v1
      model: example-model
      token_encoding: cl100k_base
      temperature: 0.1
      timeout_seconds: 120
      retry_times: 3
      max_retries: 3
      concurrency: 1
      warmup_timeout_s: 900
      extra_body: {}
    # Профили тракта M (MTPE TZ §5.1). base_url/model — заполняет пользователь
    # (локальный MT-сервер); по умолчанию пусты: pipeline=single их не требует.
    mt:
      base_url: ""
      model: ""
      api: completions
      prompt_task: mt_draft
      temperature: 0
      top_k: 1
      max_tokens_ratio: 3.0
      max_segment_tokens: 400
      stop: ["\nTranslate this from"]
      concurrency: 16
      retries: 3
      timeout_s: 120
      warmup_timeout_s: 900
    postedit:
      base_url: ""
      model: ""
      api: chat
      prompt_task: postedit
      temperature: 0
      concurrency: 8
      retries: 3
      timeout_s: 300
      warmup_timeout_s: 900
      extra_body: {chat_template_kwargs: {enable_thinking: false}}

limits:
  vocabulary_max_cards_per_1000_words: 15
  grammar_max_notes_per_chapter: 10
  glossary_max_user_prompt_chars: 8000
  # S4: состав типов упражнений главы; тип вне списка отклоняется
  # детерминированной валидацией (mc, tf, gap, translation, vocab, grammar, free)
  exercises_types: [mc, tf, gap, translation, vocab, grammar, free]
  # R6 (TZ §8): максимум размера загружаемого файла, МБ — жёсткий отказ
  upload_max_mb: 50

glossary:
  # L2: глоссарий книги (кандидаты детерминированно, LLM — перевод/пояснение/
  # парадигма). По умолчанию ВЫКЛЮЧЕНО — поведение без глоссария не меняется;
  # включение — осознанное (D60).
  enabled: false
  min_occurrences: 2        # мин. вхождений кандидата (все правила)
  ngram_min: 2              # многословные последовательности: от
  ngram_max: 4              # ...до (в слов)
  max_term_chars: 80        # кандидат длиннее — отбрасывается
  units: [kg, g, mg, l, ml, m, km, cm, mm, km/h, m/s, °C, "%", w, kw, kw·h, a, v, hz]
  style_sample_chars: 5000  # проба текста для стилевого профиля (L2.7)
  annotation_batch_size: 25 # кандидатов на один вызов LLM
  consistency_min_share: 0.95  # L2-4: ниже — предупреждение QC
  # L3: правка расхождений в выходном EPUB (ТЗ_02 §L3). По умолчанию выключена;
  # расхождения при этом по-прежнему обнаруживаются и сообщаются (L2.6).
  fix_enabled: false
  fix_max_segment_share: 0.5  # L3-6: выше — остановка задания с отчётом
  fix_sentence_delta: 1       # L3.4: допуск изменения числа предложений

alignment:
  min_coverage: 0.995
  # E6.3: критерий белого списка «идентичен оригиналу» (регулярный шаблон по
  # нормализованному тексту): перевод, совпадающий с оригиналом, нарушением
  # НЕ является, если текст целиком соответствует шаблону (числа, имена
  # собственные без склонения, декоративная пунктуация разделителей
  # «* * *» и т.п.).
  identical_whitelist_pattern: "^[\\d\\s.,;:()\\-–—/%$€*·•…†‡“”‘’„«»]+$"

segmentation:
  block_tags: [p, li, blockquote, h1, h2, h3, h4, h5, h6, dd, dt, td]

language_detection:
  # L0.4: детерминированное определение исходного языка (langdetect, не LLM).
  sample_segments: 200   # объём выборки сегментов для детектора
  min_confidence: 0.6    # порог уверенности (L0.5): ниже — NEEDS_CONFIRMATION
  seed: 42               # сид детектора (D7: воспроизводимость результата)
  multilingual_share: 0.2    # L0.6: порог доли сегментов с другим языком
  segment_min_chars: 40      # L0.6: короче — сегмент не помечается

languages:
  # L0.1/L0.2: язык это данные (Rule 1). Реестр config/languages/<code>/pack.yaml
  # и матрица пар — относительно storage.root (абсолютные пути допустимы).
  root: config/languages
  matrix: config/language_matrix.yaml

epubcheck:
  # Путь к EPUBCheck-jar (E5). Распределение W3C 5.x: каталог <каталог-jar>/lib
  # рядом с jar — класспасс собирается автоматически. Отсутствие jar/Java →
  # задание не станет COMPLETED: COMPLETED_WITH_WARNINGS (VALIDATION_UNAVAILABLE, Rule 6).
  jar_path: data/tools/epubcheck.jar
  timeout_seconds: 300

converter:
  # R6 (TZ §8, D110): Calibre ebook-convert в Podman-контейнере без сети
  # (сборка — tools/ebook-convert/build.sh, шаг в README «Шаг 1»).
  # Абсолютный путь к обёртке; пустое значение — конвертер недоступен:
  # импорт только EPUB + явная строка в UI (молчаливой деградации нет).
  binary: /absolute/path/to/tools/ebook-convert/ebook-convert
  timeout_import_seconds: 120  # TZ §8: жёсткий таймаут конвертации, с
  timeout_export_seconds: 180  # R7: экспорт
  accept: [epub, fb2, mobi, azw, azw3, docx, odt, rtf, txt, md, html, htmlz, lit, pdb, chm, pdf]

translation:
  # Режим перевода задания (E5.2): translation → REPLACE (движок),
  # bilingual → значение ниже. APPEND_BLOCK по умолчанию; APPEND_TEXT доступен
  # настройкой, но не используется по умолчанию (ухудшает выравнивание).
  submit_mode_bilingual: APPEND_BLOCK
  # Способ перевода (MTPE TZ §5.1): single (движок) | mt_pe (черновик MT +
  # постредактура). Меняется только экраном «LLM и модели».
  pipeline: single

mtpe:
  # Параметры конвейера mt_pe (MTPE TZ §5.1) — пороги фазы постредактуры.
  context_segments: 6         # предыдущих сегментов главы в контексте PE
  lang_check_min_words: 4     # короче (слов) — язык не проверяется
  max_edit_ratio: 0.40        # порог флага heavy_edit
  max_heavy_edit_ratio: 0.10  # доля heavy_edit, выше — остановка
  max_sentence_delta: 1       # допустимая разница числа предложений
  max_rejected_ratio: 0.005   # доля pe_rejected, выше — остановка
  check_every_segments: 200   # период проверки системных остановок

ui:
  # Параметры Web-интерфейса (U3, серия R). Единственное место числовых
  # дефолтов (Rule 1): веб-код, шаблоны и app.js читают эти значения,
  # собственных констант не имеют.
  page_size: 20            # размер страницы списка заданий (пагинация)
  refresh_seconds: 3       # интервал автообновления, с
  refresh_seconds_max: 15  # верхняя граница backoff при ошибке API, с
  log_tail_lines: 200      # число строк tail логов по умолчанию
  purge_min_age_days: 1    # мин. возраст задания (дни) для массовой очистки
  mobile_breakpoint_px: 641  # точка перелома «карточки → таблица», px
  tap_target_px: 44        # мин. размер тап-цели, px (TZ R §3)
  tap_gap_px: 8            # мин. зазор между тап-целями, px (TZ R T3)
  row_height_px: 64        # высота строки списка, px (TZ R §10)
  tabbar_height_px: 56     # высота таб-бара, px (+ safe-area)
  input_font_px: 16        # кегль полей ввода, px (без авто-zoom)
  export_ttl_hours: 48     # TTL каталога экспорта задания, ч (TZ R §12)
