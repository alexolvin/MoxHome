    path: /dev/kit
    states: [ok]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-X]

  S15:
    name: book-delete
    path: /books/{book}/delete
    states: [ok, error]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-S, R-F, R-X, R-Z]

  S16:
    name: settings-languages
    path: /settings/languages
    states: [ok]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-C, R-X, R-P]

  S17:
