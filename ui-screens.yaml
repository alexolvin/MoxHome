    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-F, R-X]

  S19:
    name: settings-maintenance
    path: /settings/maintenance
    states: [ok, error]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-S, R-C, R-X, R-P, R-Z]

  S20:
    name: settings-about
    path: /settings/about
    states: [ok]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-C, R-X]

  S21:
    name: job-postedit
    path: /jobs/{job}/postedit
    states: [ok, empty, error]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-S, R-C, R-X, R-Z]

  S22:
    name: not-found
    path: /__ui_audit_404__
    states: [error]
    viewports: [mobile_reference, desktop_reference]
    rules: [R-T, R-Y, R-L, R-K, R-M, R-D, R-S, R-X]

  S23:
    name: forbidden
    path: /__ui_audit_403__
    states: [error]
    viewports: [mobile_reference, desktop_reference]
