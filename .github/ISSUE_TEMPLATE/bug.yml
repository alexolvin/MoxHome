name: Bug report
description: Report a reproducible problem with MoxMate.
title: "[bug] "
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the problem.
      placeholder: Expected …, actual …
    required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: Exact commands and settings. Redact all secrets.
    required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Python version, configuration (redacted), LLM endpoint type.
    required: false
