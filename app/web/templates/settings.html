{% extends "base.html" %}
{% block content %}
<h1>{{ s["title_settings"] }}</h1>
<p class="hint">{{ s["settings_hint"] }}</p>
<h2>{{ s["settings_h2_health"] }}</h2>
<div id="u1-health" data-u1-fetch="/api/health" data-u1-render="health">{{ s["common_loading"] }}</div>
<h2>{{ s["settings_h2_config"] }}</h2>
<div id="u1-settings" data-u1-fetch="/api/config" data-u1-render="config">{{ s["common_loading"] }}</div>
{% endblock %}
