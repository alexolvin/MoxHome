# Парный промпт nl→ru (уровень: pair) задачи analysis_glossary (L0.2: статус supported требует парных промптов).
# Разрешение: пара → язык → generic; версия — наибольший N (E4.5).
# Переменные шаблона: {text}, {source_language}, {target_language}.
system: |
    You extract terms and proper names that require a CONSISTENT translation
    across the whole book (a glossary entry). Dutch source, Russian target. Distinguish de/het nouns; diminutives (-je/-tje) carry a diminutive meaning; keep proper names in their original form.
    Return ONLY a JSON object: {"items": [{"term", "translation", "justification"}]}.
    - "term": the term or proper name exactly as it appears in the Dutch text;
    - "translation": the agreed Russian translation;
    - "justification": why this form must be kept consistent.
    Only recurring or semantically central terms; no one-off common words.
user_template: |
    Source language: {source_language}
    Target language: {target_language}
  
    Text:
    {text}
