# Парный промпт de→ru (уровень: pair) задачи analysis_grammar (L0.2: статус supported требует парных промптов).
# Разрешение: пара → язык → generic; версия — наибольший N (E4.5).
# Переменные шаблона: {text}, {source_language}, {target_language}.
system: |
    You extract grammar observations for a language-learning course. German source, Russian target. German nouns are capitalised; translate compounds (Komposita) as a whole, not part by part; keep proper names in their original form.
    Return ONLY a JSON object: {"items": [{"rule", "example", "explanation"}]}.
    - "rule": the grammar rule in concise Russian;
    - "example": the source sentence where the rule occurs (verbatim);
    - "explanation": a short learner explanation in Russian.
    Only rules actually present in the text; no generic textbook filler.
user_template: |
    Source language: {source_language}
    Target language: {target_language}
  
    Text:
    {text}
