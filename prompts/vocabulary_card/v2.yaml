# Generic-промпт (уровень: generic) задачи vocabulary_card (S1, ТЗ_03).
# Задача pair_required=false: уровня generic достаточно (контекст пары и
# кандидаты — в payload).
# ВАЖНО (ТЗ_03 S1.1/S1.2): список кандидатов уже отобран детерминированно
# (лемматизация, POS-фильтр, служебные слова, частотные полосы). Модель НЕ
# ищет, не добавляет и не исключает кандидатов — она заполняет карточки
# ТОЛЬКО перечисленных кандидатов (эхо "lemma" — обязательно для каждого)
# и оценивает полезность. Выбор лексики моделью запрещён (обратный порядок
# стадий запрещён ТЗ).
# Пример: брать из "source_sentence" кандидата (пример ИЗ КНИГИ); выдуманный
# пример допускается ТОЛЬКО с "example_generated": true.
# v2: глагольные поля — строго по схеме языка-источника (main_forms — только
# германская схема); неизвестные поля отклоняют всю карточку
# (additionalProperties: false) — их выдавать запрещено.
# Переменные шаблона: {text}, {source_language}, {target_language}.
system: |
  You fill vocabulary cards for language learners from a PRE-SELECTED list of
  candidates. The list was produced deterministically; do NOT search for,
  add, merge or drop candidates: return exactly one item per candidate, with
  the candidate's "lemma" echoed verbatim in "lemma".
  Return ONLY a JSON object: {"items": [{"lemma", "meaning", "translation",
  "example", "example_generated", "usefulness", ...}]}.
  - "meaning": a short definition in the target language;
  - "translation": the translation into the target language;
  - "example": prefer the candidate's "source_sentence" (an example FROM the
    book); if you must use a different sentence, set "example_generated": true;
  - "usefulness": integer 1..10, how useful this word is for a learner at the
    user's CEFR level (payload field "user_cefr"); out-of-range words are not
    forbidden — judge usefulness honestly;
  - part-of-speech fields: emit ONLY the fields the card schema of the SOURCE
    language defines for the candidate's "pos" (e.g. article/plural for a noun,
    auxiliary/main_forms/separable for a verb). main_forms/auxiliary/separable
    are fields of the GERMAN verb schema ONLY: a verb in any non-German
    language (e.g. English) uses the verb fields its own schema defines (e.g.
    past_tense, past_participle) — never main_forms. Do NOT emit a field that
    the schema does not define: unknown fields are rejected
    (additionalProperties: false). Omit (or set null) fields that do not apply
    to the pos.
user_template: |
  Source language: {source_language}
  Target language: {target_language}

  Card payload (JSON):
  {text}
